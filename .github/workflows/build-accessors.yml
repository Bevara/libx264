name: Build accessors

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  # Must match Bevara/third_parties/emsdk_vers.txt: the prebuilt libraries in
  # lib/ are compiled with that emsdk, and an older wasm-opt rejects the
  # target features they carry (e.g. bulk-memory-opt).
  EMCC_VERSION: 6.0.8
  TAG_NUMBER: 1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{env.EMCC_VERSION}}
  
    - uses: actions/checkout@v4

    - name: Configure 
      run: emcmake cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Retrieve tag name
      run: |
        echo "TAG_NAME=$(awk -F'[()]' '/add_filter/{print $2}' CMakeLists.txt | awk '{print $1}')" >> $GITHUB_OUTPUT
      id: version

    - name: Rename description file for release
      run: cp ${{ steps.version.outputs.TAG_NAME }}.json ${{ steps.version.outputs.TAG_NAME }}_${{env.TAG_NUMBER}}.json

    - name: Move accessor to the root of the project
      run: cp build/${{ steps.version.outputs.TAG_NAME }}_${{env.TAG_NUMBER}}.wasm ${{ steps.version.outputs.TAG_NAME }}_${{env.TAG_NUMBER}}.wasm
          
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: accessor-build  
        path: |
          ${{ steps.version.outputs.TAG_NAME }}_${{env.TAG_NUMBER}}.wasm
          ${{ steps.version.outputs.TAG_NAME }}_${{env.TAG_NUMBER}}.json

    - name: Publish release
      if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NAME: ${{ steps.version.outputs.TAG_NAME }}
        TAG: ${{ env.TAG_NUMBER }}
      run: |
        set -euo pipefail
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "${NAME}_${TAG}.wasm" "${NAME}_${TAG}.json" --clobber
        else
          gh release create "$TAG" "${NAME}_${TAG}.wasm" "${NAME}_${TAG}.json" \
            --title "$TAG" \
            --notes "Automated build of ${NAME} accessor (emsdk ${EMCC_VERSION})."
        fi
